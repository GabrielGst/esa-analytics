name: Deploy to production

on:
  push:
    branches:
      - public
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flask image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.flask
          push: true
          tags: ghcr.io/${{ env.OWNER }}/esa-analytics-flask:latest

      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nextjs
          push: true
          tags: ghcr.io/${{ env.OWNER }}/esa-analytics-nextjs:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Create deploy directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /opt/esa-analytics

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/esa-analytics/

      - name: Pull images and restart containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/esa-analytics
            cp /opt/esa-analytics-secrets/.env.local .env.local
            cp /opt/esa-analytics-secrets/flask.env flask/.env
            docker compose pull
            docker compose up -d
